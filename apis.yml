aid: candex
name: Candex
description: >-
  Candex is a fintech "master vendor" platform that lets large enterprises engage, track,
  and pay long-tail, one-time, and hard-to-onboard suppliers across more than 50 countries
  without setting each vendor up in their own ERP or finance systems. A buyer configures
  Candex once; when it needs to purchase from a small or irregular supplier, it transacts
  with Candex, which handles supplier onboarding, tax and banking validation, compliance
  scans, PO and non-PO invoicing, and cross-border payment execution, then remits to the
  actual supplier. By consolidating tail-spend vendors and their records, Candex reduces
  administrative overhead, increases spend visibility and control, and makes "No PO, No Pay"
  policies achievable. The company integrates with existing procurement and finance stacks
  via API and bulk upload, but publishes no public developer portal or API reference.
